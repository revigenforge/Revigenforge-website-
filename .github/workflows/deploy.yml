name: Deploy site

on:
  push:
    # This repository's default branch is the feature branch below; `main`
    # is listed too so the workflow keeps working if the default changes.
    branches:
      - main
      - claude/revigen-forge-landing-5uaqyv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings → Pages). configure-pages has an `enablement: true` option
      # that tries to turn it on automatically, but the workflow's
      # GITHUB_TOKEN is not permitted to create a Pages site, so it fails
      # with "Resource not accessible by integration". Enabling it is a
      # one-time manual step; every deploy after that is automatic.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
